  <path d="M27 31 Q27 36 32 37 Q37 36 37 31" stroke="url(#g2)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Filament lines -->
  <line x1="29" y1="37" x2="29" y2="39" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="37" x2="35" y2="39" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="39" x2="35" y2="39" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- IP text bottom -->
  <text x="32" y="51" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif"
